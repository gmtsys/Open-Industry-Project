# deploy/gcp/nginx.conf — GOMOTEC 포털용 시뮬레이터 이미지(Cloud Run portal-sim-<env>)의 nginx 설정.
#
# 원본은 Cloudflare Pages 에 올리고 응답 머리를 public/_headers · public/_redirects 로 준다. 여기서는 같은 규칙을 nginx 로 옮겼다 —
# 원본 _headers 가 바뀌면 이 파일도 맞춘다(특히 /app 의 COOP · COEP: 없으면 물리 엔진 다중 스레드가 안 돈다).
#
# [우리가 더한 것 — connect-src] 사내 라인 · 로직이 밖으로 나가지 않게 브라우저가 연결할 수 있는 곳을 이 서버와
#   원본 부품 라이브러리(parts.openindustryproject.org — 받아 오기만)로 묶는다. 그래서 원본 회사의 «같이 편집» 서버
#   (wss://collab.openindustryproject.org)와 GitHub 게시(signin · api.github.com)는 연결이 막힌다.
#   같이 편집이 필요해지면 우리 서버에 Hocuspocus 를 띄우고(server/DEPLOY.md) 빌드 때 VITE_COLLAB_URL 을 주고 여기에 그 주소를 더한다.
# [비루트] Cloud Run 은 nginx 계정(uid 101)으로 돈다 — 포트 8080. pid · 임시 경로는 /var/cache/nginx(빌드가 nginx 계정에 넘긴다).
#   /tmp 에 두면 빌드의 `nginx -t`(root)가 만든 root 소유 pid 파일이 이미지에 남아 실행이 죽는다(포털 apps/web/nginx.conf 에서 겪은 일).

worker_processes auto;
pid /var/cache/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # nginx 기본 표에 없는 것 — .mjs 를 octet-stream 으로 내면 모듈 워커가 안 뜬다
  types {
    application/javascript mjs;
    model/gltf-binary glb;
    model/gltf+json gltf;
    application/manifest+json webmanifest;
  }

  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;
  fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
  scgi_temp_path /var/cache/nginx/scgi_temp;

  access_log off;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml model/gltf+json application/manifest+json;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    # Cloud Run 앞단이 https 를 맡는다 — 넘기는 주소는 상대 경로로(포트 8080 이 새지 않게)
    absolute_redirect off;

    # 모든 응답: 남의 페이지 안에 못 들어가게(원본 _headers «/*») + 연결 대상 제한(머리 주석)
    set $oip_csp "frame-ancestors 'none'; connect-src 'self' blob: data: https://parts.openindustryproject.org";

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # 원본 _redirects
    location = /st { return 301 /plc/; }
    location = /st/ { return 301 /plc/; }

    # 편집기 껍데기 — COOP + COEP 가 있어야 SharedArrayBuffer(다중 스레드 Jolt)가 열린다. no-store 는 원본 _headers 주석 그대로(사파리)
    location = /app { return 301 /app/; }
    location /app/ {
      add_header Content-Security-Policy $oip_csp always;
      add_header X-Frame-Options DENY always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Embedder-Policy require-corp always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      add_header Cache-Control no-store always;
      # 원본 _redirects «/app/* /app/ 200» — 편집기 안 주소는 전부 같은 껍데기
      try_files $uri /app/index.html;
    }

    # 해시 붙은 빌드 산출물 — 워커 · wasm 도 여기서 나간다
    location /assets/ {
      add_header Content-Security-Policy $oip_csp always;
      add_header X-Frame-Options DENY always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Cross-Origin-Embedder-Policy require-corp always;
      add_header Cross-Origin-Resource-Policy same-origin always;
    }

    # 서비스 워커 — 늘 다시 확인(배포가 열린 탭에 닿게)
    location ~ ^/(sw|registerSW)\.js$ {
      add_header Content-Security-Policy $oip_csp always;
      add_header X-Frame-Options DENY always;
      add_header Cache-Control no-cache always;
      add_header Cross-Origin-Embedder-Policy require-corp always;
      add_header Cross-Origin-Resource-Policy same-origin always;
    }
    location = /manifest.webmanifest {
      add_header Content-Security-Policy $oip_csp always;
      add_header X-Frame-Options DENY always;
      add_header Cache-Control no-cache always;
    }

    location /part-assets/ {
      add_header Content-Security-Policy $oip_csp always;
      add_header X-Frame-Options DENY always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ ^/(models|textures|thumbnails)/ {
      add_header Content-Security-Policy $oip_csp always;
      add_header X-Frame-Options DENY always;
      add_header Cache-Control "public, max-age=86400" always;
    }
    location /fonts/ {
      add_header Content-Security-Policy $oip_csp always;
      add_header X-Frame-Options DENY always;
      add_header Cache-Control "public, max-age=31536000" always;
    }

    # 저작권 고지 — 브라우저가 내려받지 않고 보여 주게(원본 _headers)
    location = /LICENSE {
      default_type "text/plain; charset=utf-8";
      add_header Content-Security-Policy $oip_csp always;
      add_header X-Frame-Options DENY always;
    }
    location = /THIRD_PARTY_NOTICES.md {
      types { }
      default_type "text/plain; charset=utf-8";
      add_header Content-Security-Policy $oip_csp always;
      add_header X-Frame-Options DENY always;
    }

    location / {
      add_header Content-Security-Policy $oip_csp always;
      add_header X-Frame-Options DENY always;
      try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
  }
}
